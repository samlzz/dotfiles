# Minimal remote tmux config
# Prefix is Ctrl+N (not the default Ctrl+B) specifically so this config
# doesn't fight an outer/local tmux when you SSH from inside one.

set -g prefix C-n
unbind C-b
bind C-n send-prefix

set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:Tc'

# Lets OSC 52 escape sequence reach the real terminal through tmux.
set -g set-clipboard on

# vi-style selection/yank in copy-mode comes with this
setw -g mode-keys vi

set -g status-left '[#S] '
set -g status-left-length 20
set -g status-right '#H %H:%M'
set -g window-status-current-style 'bold,reverse'

bind r source-file ~/.tmux.conf \; display-message 'Config reloaded...'
